version: 2

# Dependabot automates dependency update PRs + vulnerability alerts.
# Free, GitHub-native. PRs land weekly with security patches.
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      # Group security patches into one PR for easier review
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
      # Routine minor/patch bumps arrive as ONE weekly PR instead of one per package.
      # Majors stay separate so they get their own review.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # Pin Capacitor major version — cross-plugin coordination required
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capgo/*"
        update-types: ["version-update:semver-major"]
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      # Everything else minor/patch in one weekly PR; majors separate.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@radix-ui/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
