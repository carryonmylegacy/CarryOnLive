name: CarryOn CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Silence the Node 20 deprecation warning on GitHub-hosted runners.
  # Remove after all actions support Node 24 natively (est. late 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SOC2 [CC6.1] — secret scan is a HARD GATE (audit d5a54f5e P2): a
          # leaked credential now FAILS the job and blocks the merge instead of
          # merely annotating. Known false-positives are managed via the
          # repo-root .gitleaks.toml allowlist.

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.15,<1.0"
      - name: Lint (ruff check)
        working-directory: backend
        run: ruff check .
      - name: Format check (ruff format --check)
        id: fmt
        working-directory: backend
        run: ruff format --check .
      # If format check failed, show the exact fix the developer needs to run.
      - name: Format fix instructions (on failure)
        if: failure() && steps.fmt.conclusion == 'failure'
        run: |
          echo "::error::ruff format check failed — run locally: cd backend && ruff format ."
          echo "::notice::Or install the pre-commit hook with: bash scripts/setup-dev.sh"

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        # NOTE: --frozen-lockfile temporarily disabled. Emergent's Save-to-GitHub
        # auto-commit system skips yarn.lock updates, causing CI to fail with
        # "lockfile needs to be updated" even when the working tree is in sync.
        # Until the lockfile sync is resolved at the platform level, we allow
        # yarn to reconcile on CI. package.json is still the source of truth.
        run: yarn install --frozen-lockfile || yarn install
      - name: ESLint (errors only)
        working-directory: frontend
        run: yarn lint:errors

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          pip install pytest pytest-asyncio httpx
      - name: Run tests
        working-directory: backend
        env:
          # Valid-but-unreachable URI: motor connects lazily, so app modules
          # import cleanly; any test that actually awaits the DB still fails.
          # ("" crashed AsyncIOMotorClient at import → collection error.)
          MONGO_URL: "mongodb://localhost:27017"
          DB_NAME: "carryon_test"
          # ≥32 bytes — PyJWT raises InsecureKeyLengthWarning (escalated to
          # error by the test warning filter) for shorter HMAC keys.
          JWT_SECRET: "test-secret-key-ci-0123456789abcdef"
          ENCRYPTION_KEY: "test-encryption-key-1234567890abcdef"
          FRONTEND_URL: "http://localhost:3000"
          PYTHONDEVMODE: "1" # surfaces DeprecationWarning (e.g. datetime.utcnow)
        run: pytest tests/ -x -q --tb=short -W error::DeprecationWarning 2>&1 | tail -30

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile || yarn install
      - name: Build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://carryon.us
          CI: false
        run: yarn build
      - name: Bundle size check
        working-directory: frontend
        run: |
          # Informational guardrail against runaway growth. Threshold set to a
          # realistic ceiling for this PWA (was 1 MB, which warned on every build
          # since the app legitimately exceeds it). Never fails the build.
          MAIN_SIZE=$(du -b build/static/js/main.*.js 2>/dev/null | awk '{s+=$1} END {print s}')
          MAX_SIZE=4194304  # 4 MB
          echo "Main bundle: ${MAIN_SIZE:-0} bytes (informational ceiling: $MAX_SIZE)"
          if [ "${MAIN_SIZE:-0}" -gt "$MAX_SIZE" ]; then
            echo "::warning::Main JS bundle exceeds ${MAX_SIZE} bytes — consider code-splitting"
          fi

  e2e-smoke:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: frontend-build
    timeout-minutes: 25
    # SOC2 CHANGE-MANAGEMENT GATE (audit #1798): the Playwright E2E smoke is
    # REQUIRED evidence that each production/staging change was end-to-end
    # verified before release. It is gated on `vars.RUN_E2E == 'true'` only
    # because GitHub forbids `secrets.*` in a job `if:`. Once the E2E secrets
    # (E2E_BASE_URL, E2E_API_URL, E2E_ADMIN_EMAIL, E2E_ADMIN_PASSWORD) are
    # configured, the repo/org variable `RUN_E2E` MUST be set to 'true' for the
    # production/staging deploy path so no release merges without a green
    # end-to-end smoke. Leaving it unset is acceptable ONLY for environments
    # with no deployed target to smoke against.
    if: ${{ vars.RUN_E2E == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile || yarn install
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Warm up preview (wake pod + prime Cloudflare cookie)
        # Hits the preview URL a few times so Cloudflare issues a
        # `cf_clearance` cookie to the runner and the preview pod is
        # no longer cold when Playwright starts. `globalSetup` then
        # captures the cf cookie into storageState for all specs.
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "::notice::E2E_BASE_URL not set, skipping warmup"
            exit 0
          fi
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$E2E_BASE_URL/login" || echo "000")
            echo "Warmup attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 3
          done
      - name: Run E2E smoke suite
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        # CI runs the DESKTOP smoke suite only — explicitly scoped to
        # tests/e2e/smoke.spec.js (8 critical-path tests). The smoke-chromium
        # PROJECT's testDir is the whole tests/e2e/ folder, so WITHOUT the
        # explicit file path this ran all ~73 offline-phase/toggle/signup specs
        # (designed for localhost) against the remote Cloudflare preview and
        # blew past the 25m job cap. Keep the file path in `e2e:smoke:desktop`.
        # Full suite + mobile run locally via `yarn e2e` or a nightly workflow.
        run: yarn e2e:smoke:desktop
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  deploy-gate:
    name: SOC2 Deploy Gate (all required checks green on main)
    runs-on: ubuntu-latest
    needs: [secret-scan, backend-lint, frontend-lint, backend-tests, frontend-build, e2e-smoke]
    # audit #d0c48d7 / #5391e8b #8 — explicit change-management gate (SOC2
    # CC8.1). On the production/staging release branch (main, push), a build
    # CANNOT be treated as verified unless EVERY required check — secret scan,
    # backend/frontend lint, backend tests, and frontend build — is green.
    # E2E evidence policy (founder fix, Jun 2026): the RUN_E2E=true hard
    # requirement silently blocked EVERY production deploy while the E2E
    # secrets were unconfigured (Render autoDeploy is off; the Deploy Hook
    # below is the ONLY release path — pushes stopped deploying entirely).
    # E2E is now enforced ONLY once configured: if vars.RUN_E2E == 'true',
    # the smoke MUST pass; if unset, the gate proceeds with a loud warning
    # so the missing evidence is visible on every run without bricking
    # releases. `always()` ensures the gate still runs (and fails) when an
    # upstream job is skipped or failed. This job is the single status check
    # repo admins mark REQUIRED in branch protection (see
    # docs/DEPLOY_PROTECTION_SETTINGS.md).
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - name: Require every required check to be green
        run: |
          fail=0
          check() {
            if [ "$2" != "success" ]; then
              echo "::error::SOC2 deploy gate — required check '$1' is '$2' (must be 'success')."
              fail=1
            else
              echo "✅ $1: success"
            fi
          }
          check "secret-scan"    "${{ needs.secret-scan.result }}"
          check "backend-lint"   "${{ needs.backend-lint.result }}"
          check "frontend-lint"  "${{ needs.frontend-lint.result }}"
          check "backend-tests"  "${{ needs.backend-tests.result }}"
          check "frontend-build" "${{ needs.frontend-build.result }}"
          if [ "${{ vars.RUN_E2E }}" = "true" ]; then
            if [ "${{ needs.e2e-smoke.result }}" != "success" ]; then
              echo "::error::SOC2 deploy gate FAILED — E2E smoke result=${{ needs.e2e-smoke.result }} (must be 'success' when RUN_E2E=true)."
              fail=1
            else
              echo "✅ e2e-smoke: success"
            fi
          else
            echo "::warning::E2E smoke NOT configured (vars.RUN_E2E != 'true') — deploying WITHOUT end-to-end change-management evidence. Set repo variable RUN_E2E=true plus secrets E2E_BASE_URL, E2E_API_URL, E2E_ADMIN_EMAIL, E2E_ADMIN_PASSWORD to enforce it."
            echo "⚠️ e2e-smoke: skipped (RUN_E2E not configured — gate proceeds)"
          fi
          if [ "$fail" = "1" ]; then exit 1; fi
          echo "✅ SOC2 deploy gate satisfied — all required checks green on main."
      - name: Write deploy evidence (SOC2 CC8.1)
        if: always()
        run: |
          mkdir -p deploy-evidence
          cat > deploy-evidence/deploy-gate.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "checks": {
              "secret_scan": "${{ needs.secret-scan.result }}",
              "backend_lint": "${{ needs.backend-lint.result }}",
              "frontend_lint": "${{ needs.frontend-lint.result }}",
              "backend_tests": "${{ needs.backend-tests.result }}",
              "frontend_build": "${{ needs.frontend-build.result }}",
              "e2e_smoke": "${{ needs.e2e-smoke.result }}",
              "run_e2e_var": "${{ vars.RUN_E2E }}"
            }
          }
          EOF
          cat deploy-evidence/deploy-gate.json
      - name: Upload deploy evidence artifact (90-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soc2-deploy-evidence
          path: deploy-evidence/
          retention-days: 90
      - name: Trigger Vercel production deploy (ONLY after gate is green)
        # Fires the existing Vercel "Emergent" Deploy Hook only once the SOC2
        # deploy gate has passed, so production can never deploy ahead of CI.
        # `if: success()` => this step is skipped when the gate step above
        # exited non-zero. Requires repo secret VERCEL_DEPLOY_HOOK_URL
        # (Settings -> Secrets and variables -> Actions). No-op (notice only)
        # until that secret is set, so adding this never breaks a build.
        if: success()
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL secret not set — Vercel was NOT triggered. Add it under Settings → Secrets and variables → Actions if CI should drive frontend deploys."
            exit 0
          fi
          echo "SOC2 gate green — triggering Vercel production deploy via Deploy Hook…"
          resp=$(curl -s -w "\n%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK_URL")
          body=$(echo "$resp" | sed '$d')
          code=$(echo "$resp" | tail -n1)
          echo "Vercel deploy hook responded HTTP $code"
          echo "Vercel response body: $body"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Vercel deploy hook failed (HTTP $code)"
            exit 1
          fi
          echo "✅ Vercel production deploy triggered."
      - name: Trigger Render production deploy (ONLY after gate is green)
        # Same pattern as Vercel: fires a Render Deploy Hook only once the SOC2
        # deploy gate is green, so the backend never deploys ahead of CI.
        # Requires repo secret RENDER_DEPLOY_HOOK_URL (Settings -> Secrets and
        # variables -> Actions). No-op (notice only) until that secret is set.
        if: success()
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret not set — Render was NOT triggered. With Render Auto-Deploy off, this secret is the ONLY release path: add it under Settings → Secrets and variables → Actions (value: Render dashboard → Service → Settings → Deploy Hook)."
            exit 0
          fi
          echo "SOC2 gate green — triggering Render production deploy via Deploy Hook…"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render deploy hook responded HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Render deploy hook failed (HTTP $code)"
            exit 1
          fi
          echo "✅ Render production deploy triggered."

