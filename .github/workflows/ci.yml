name: CarryOn CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.15,<1.0"
      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          pip install pytest pytest-asyncio httpx
      - name: Run tests
        working-directory: backend
        env:
          MONGO_URL: ""
          DB_NAME: "carryon_test"
          JWT_SECRET: "test-secret-key-ci"
          ENCRYPTION_KEY: "test-encryption-key-1234567890abcdef"
          FRONTEND_URL: "http://localhost:3000"
        run: pytest tests/ -x -q --tb=short 2>&1 | tail -20

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: yarn install
      - name: Build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://carryon.us
          CI: false
        run: yarn build
