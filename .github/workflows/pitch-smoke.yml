name: Pitch-Day Smoke (Production API)

# Lightweight curl-based smoke test that hits the 8 critical conversion
# endpoints on the live production backend. Designed to:
#   - run on every push to main (i.e. every production deploy)
#   - run hourly as a passive watchdog
#   - be manually triggerable (workflow_dispatch)
#   - be deploy-webhook triggerable (repository_dispatch type: deploy-smoke)
#
# On failure: Slack-pings SLACK_WEBHOOK_URL (if configured) and opens / appends
# to a GitHub issue tagged `pitch-smoke-alert`. Closes the issue on recovery.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   PROD_API_URL            e.g. https://api.carryon.us  (the FastAPI/Railway
#                           backend origin — NOT the Vercel frontend at
#                           app.carryon.us, which would return 405 on POST.)
#   PITCH_SMOKE_EMAIL       e.g. info@carryon.us         (benefactor test acct)
#   PITCH_SMOKE_PASSWORD    e.g. Demo1234!
#   SLACK_WEBHOOK_URL       optional — Slack incoming webhook for fail pings
#
# Enable: add the secrets above. No additional toggle needed.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "memory/**"
  schedule:
    - cron: "0 * * * *"          # hourly
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-smoke]

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Curl 8 conversion endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Verify required secrets are configured
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          PITCH_SMOKE_EMAIL: ${{ secrets.PITCH_SMOKE_EMAIL }}
          PITCH_SMOKE_PASSWORD: ${{ secrets.PITCH_SMOKE_PASSWORD }}
        run: |
          missing=()
          [ -z "$PROD_API_URL" ]         && missing+=("PROD_API_URL")
          [ -z "$PITCH_SMOKE_EMAIL" ]    && missing+=("PITCH_SMOKE_EMAIL")
          [ -z "$PITCH_SMOKE_PASSWORD" ] && missing+=("PITCH_SMOKE_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Skipping smoke — missing repo secrets: ${missing[*]}"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Run pitch_smoke.sh against production
        if: env.SKIP != '1'
        env:
          API_URL: ${{ secrets.PROD_API_URL }}
          TEST_EMAIL: ${{ secrets.PITCH_SMOKE_EMAIL }}
          TEST_PASSWORD: ${{ secrets.PITCH_SMOKE_PASSWORD }}
        run: bash scripts/pitch_smoke.sh | tee smoke.log

      # ── Alerting on failure ─────────────────────────────────────────────
      - name: Ping Slack on failure
        if: failure() && env.SKIP != '1'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "No SLACK_WEBHOOK_URL — skipping Slack ping."; exit 0; }
          # Extract the FAIL lines so the Slack message is actionable.
          fails=$(grep -E "FAIL  " smoke.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | head -10 | sed 's/"/\\"/g' | awk '{printf "%s\\n", $0}')
          payload=$(cat <<EOF
          {
            "text": "🚨 *CarryOn pitch-smoke FAILED on production.*",
            "blocks": [
              { "type": "section", "text": { "type": "mrkdwn", "text": "🚨 *CarryOn pitch-smoke FAILED on production.*\n<${RUN_URL}|Open run>" } },
              { "type": "section", "text": { "type": "mrkdwn", "text": "\`\`\`${fails:-See run log for details.}\`\`\`" } }
            ]
          }
          EOF
          )
          curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Open or update GitHub issue on failure
        if: failure() && env.SKIP != '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let smokeLog = '';
            try {
              smokeLog = fs.readFileSync('smoke.log', 'utf8').replace(/\x1b\[[0-9;]*m/g, '').slice(0, 4000);
            } catch (_) {}
            const title = `🚨 Pitch-smoke: production API failed`;
            const body = [
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `**Commit:** ${context.sha}`,
              `**Trigger:** ${context.eventName}`,
              '',
              'One or more of the 8 critical conversion endpoints regressed on production.',
              '',
              '```',
              smokeLog || '(no smoke.log captured)',
              '```',
              '',
              'Likely culprits (in order of recency):',
              '- A recent backend deploy broke a route (check Railway logs)',
              '- `PROD_API_URL` secret points at the wrong origin (Vercel returns 405 on POST)',
              '- `PITCH_SMOKE_PASSWORD` was rotated and the secret was not updated',
              '- Stripe key rotation cascade (checkout endpoint returns 500)',
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'pitch-smoke-alert',
              state: 'open',
              per_page: 1,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `**Still failing** — ${new Date().toISOString()}\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['pitch-smoke-alert', 'p0'],
              });
            }

      - name: Close pitch-smoke-alert on recovery
        if: success() && env.SKIP != '1'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'pitch-smoke-alert',
              state: 'open',
              per_page: 5,
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Pitch-smoke recovered — production API is green again at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
