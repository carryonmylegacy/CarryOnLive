# .gitleaks.toml — CarryOn secret scanner configuration
#
# This file tells gitleaks which patterns are intentional and safe in this repo.
# The values below are PUBLIC client-side keys, not secrets:
#
#  • Stripe pk_live_ (publishable key) — designed to be embedded in
#    frontend code. See: https://docs.stripe.com/keys
#    "It's okay to embed this key..."
#
#  • Google Maps / Firebase API keys — client-side keys restricted by
#    HTTP referrer + package name. The actual restriction is configured
#    in Google Cloud Console, not by keeping the key out of the repo.
#    See: https://developers.google.com/maps/api-security-best-practices
#
#  • VAPID public key — half of a public/private keypair. Public half is safe.
#
# True secrets (STRIPE_API_KEY sk_live_, STRIPE_WEBHOOK_SECRET whsec_,
# JWT_SECRET, etc.) live in .env + Railway environment variables and are
# never committed. Their patterns are DETECTED by gitleaks default rules;
# only the public-key families below are allow-listed.
#
# Allow-list patterns are intentionally written as PREFIX + WILDCARD
# (rather than the literal key bodies) so this file itself does not get
# flagged by upstream secret scanners that do not honor gitleaks configs.

[allowlist]
description = "Public frontend API keys — visible in browser bundle, not secrets"
regexes = [
    # Stripe publishable key — pk_live_ followed by the project prefix
    # and a long alphanumeric tail. Matches any length >= 90.
    "pk_live_5[0-9]T[0-9A-Za-z]{4}[A-Za-z0-9]{80,}",
    # Google Maps / Firebase API keys — `AIzaSy` prefix, 33-char tail.
    # Restricted in Google Cloud Console by referrer / package name.
    "AIzaSy[A-Za-z0-9_\\-]{33}",
    # VAPID public key — 87-char base64url string starting with `BB`.
    "BB[A-Za-z0-9_\\-]{85}",
]
paths = [
    "codemagic.yaml",
    "backend/routes/staff_tools.py",
    "load_tests/signup_and_dashboard.js",
    "memory/LAUNCH_DAY_OPERATOR_GUIDE.md",
    "memory/test_credentials.md",
]
