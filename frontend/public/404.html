<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B1221" />
  <title>Page not found · CarryOn™</title>
  <link rel="icon" href="/carryon-app-icon-square-512.png" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0B1221; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: calc(2rem + env(safe-area-inset-top, 0px)) 1.5rem calc(2rem + env(safe-area-inset-bottom, 0px)); }
    img { height: 72px; width: auto; margin-bottom: 1.5rem; }
    p.eyebrow { color: #d4af37; font-size: .75rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; margin: 0 0 .75rem; }
    h1 { font-size: clamp(1.75rem, 5vw, 2.75rem); line-height: 1.15; margin: 0 0 .75rem; color: #fff; }
    p.lead { color: #8b97ab; font-size: 1.05rem; max-width: 34rem; margin: 0 0 2rem; line-height: 1.5; }
    .actions { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: center; }
    a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 1.5rem; border-radius: .75rem; font-weight: 700; text-decoration: none; transition: transform .15s ease; }
    a.btn:active { transform: scale(.97); }
    a.primary { background: #d4af37; color: #0B1221; }
    a.ghost { color: #d4af37; border: 1px solid rgba(212,175,55,.45); }
    footer { margin-top: 3rem; color: #334155; font-size: .75rem; }
    footer a { color: #4a5568; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/carryon-logo.png" alt="CarryOn" />
    <p class="eyebrow">Error 404</p>
    <h1>That page isn’t here.</h1>
    <p class="lead">The link may be old or mistyped. Everything you need is one tap away.</p>
    <div class="actions">
      <a class="btn primary" href="/">Home</a>
      <a class="btn ghost" href="/start">Start Now</a>
      <a class="btn ghost" href="/login">Sign In</a>
    </div>
    <footer>Need help? <a href="mailto:support@carryon.us">support@carryon.us</a> · <a href="tel:+17038890017">(703) 889-0017</a></footer>
  </main>
</body>
</html>
