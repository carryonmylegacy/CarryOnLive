        <!-- Apple-touch-icon family: declaring explicit sizes lets Safari pick

        <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/apple-touch-icon-152.png" />
        <link rel="apple-touch-icon" sizes="167x167" href="%PUBLIC_URL%/apple-touch-icon-167.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon-180.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <!-- iOS `apple-touch-startup-image` intentionally NOT used.
             iOS caches those PNGs at install time and refuses to refresh
             them, causing old splash images to persist through deploys.
             We draw the flag-hero splash entirely in HTML below so every
             launch shows exactly what the current code defines. -->
        <meta property="og:image" content="https://www.carryon.us/og-image.jpg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="CarryOn — the family continuity platform" />
        <meta property="og:site_name" content="CarryOn" />
        <meta property="og:locale" content="en_US" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:site" content="@carryonus" />
        <meta name="twitter:image" content="https://www.carryon.us/og-image.jpg" />
        <meta name="author" content="CarryOn" />

        <!-- Schema.org structured data: Organization + WebSite + SoftwareApplication.
             These three blocks let Google show a rich card with logo, search box,
             and 'About' panel for "CarryOn" branded queries. -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Organization",
              "@id": "https://www.carryon.us/#organization",
              "name": "CarryOn",
              "alternateName": "CarryOn™",
              "url": "https://www.carryon.us/",
              "logo": "https://www.carryon.us/carryon-app-icon-square-512.png",
              "description": "The family continuity platform for American families — keeping families ready, connected, and clear through any disruption, from a hospital stay or deployment to a disaster or the final day. People, plans, documents, finances, and guided next steps in one system.",
              "address": {
                "@type": "PostalAddress",
                "streetAddress": "1550 Wilson Boulevard 7th Floor",
                "addressLocality": "Arlington",
                "addressRegion": "VA",
                "postalCode": "22209",
                "addressCountry": "US"
              },
              "contactPoint": [{
                "@type": "ContactPoint",
                "telephone": "+1-703-889-0017",
                "contactType": "Customer Support",
                "email": "info@carryon.us",
                "areaServed": "US",
                "availableLanguage": ["English"]
              }, {
                "@type": "ContactPoint",
                "email": "security@carryon.us",
                "contactType": "Security"
              }],
              "sameAs": [
                "https://twitter.com/carryonus",
                "https://www.linkedin.com/company/carryon"
              ]
            },
            {
              "@type": "WebSite",
              "@id": "https://www.carryon.us/#website",
              "url": "https://www.carryon.us/",
              "name": "CarryOn",
              "publisher": { "@id": "https://www.carryon.us/#organization" },
              "inLanguage": "en-US"
            },
            {
              "@type": "SoftwareApplication",
              "name": "CarryOn",
              "applicationCategory": "LifestyleApplication",
              "operatingSystem": "Web, iOS, Android"
            }
          ]
        }
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preload" href="%PUBLIC_URL%/flag-bg.jpg" as="image" imagesrcset="%PUBLIC_URL%/flag-bg-800.webp 800w, %PUBLIC_URL%/flag-bg-1280.webp 1280w" imagesizes="100vw" />
        <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
        <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
        <link rel="dns-prefetch" href="https://places.googleapis.com" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <script>
            if (window.location.hostname.includes('emergentagent.com')) {
                var ems = document.createElement('script');
                ems.src = 'https://assets.emergent.sh/scripts/emergent-main.js';
                document.head.appendChild(ems);
            }
        </script>
        <!-- Meta Pixel Code -->
        <!--
          Guarded: Meta Pixel's fbevents.js hooks into
          history.replaceState() to auto-track SPA navigations. On
          iOS Safari when running as an installed PWA (home-screen
          launch), React Router + our warm-up flows fire enough
          replaceState calls in the first 10s to trip the browser's
          hard-coded 100-per-10-seconds SecurityError limit. That
          SecurityError then bubbles up into our RouteErrorBoundary
          and the founder sees "Something went wrong" right after
          offline login.

          Loading the pixel from regular browser tabs (where paid ads
          actually land) is unaffected — ONLY the installed PWA
          (navigator.standalone === true on iOS, or display-mode
          standalone elsewhere) skips the loader. Zero marketing
          impact, full crash fix.
        -->
        <script>
            (function () {
              try {
                var isIosPWA = (typeof navigator !== 'undefined') && navigator.standalone === true;
                var isStandalone = (typeof window !== 'undefined') && window.matchMedia
                  && window.matchMedia('(display-mode: standalone)').matches;
                if (isIosPWA || isStandalone) {
                  // Installed PWA — DON'T load fbevents.js. No tracker,
                  // no replaceState storm, no boundary crash.
                  return;
                }
                !function(f,b,e,v,n,t,s)
                {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
                n.callMethod.apply(n,arguments):n.queue.push(arguments)};
                if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
                n.queue=[];t=b.createElement(e);t.async=!0;
                t.src=v;s=b.getElementsByTagName(e)[0];
                s.parentNode.insertBefore(t,s)}(window, document,'script',
                'https://connect.facebook.net/en_US/fbevents.js');
                fbq('init', '%REACT_APP_META_PIXEL_ID%');
                fbq('track', 'PageView');
              } catch (e) { /* pixel never breaks the app */ }
            })();
        </script>
        <noscript><img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=%REACT_APP_META_PIXEL_ID%&ev=PageView&noscript=1"
        /></noscript>
        <!-- End Meta Pixel Code -->
        <!-- Boot-splash CSS — placed in <head> so it applies during HTML
             parse, BEFORE #carryon-boot-splash paints. The splash ALWAYS
             draws the flag-hero scene (flag bg + floating logo + caption
             + spinner), in both browser AND installed-PWA mode. This
             avoids iOS caching issues with apple-touch-startup-image. -->
        <style>
            @keyframes carryon-spin { to { transform: rotate(360deg); } }
            @keyframes carryon-float-in {
                0%   { transform: translateY(24px) scale(0.94); opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.2)); }
                60%  { opacity: 1; }
                100% { transform: translateY(0) scale(1); opacity: 1; filter: drop-shadow(0 12px 28px rgba(0,0,0,0.55)) drop-shadow(0 4px 12px rgba(212,175,55,0.18)); }
            }
            @keyframes carryon-float {
                0%   { transform: translateY(0); }
                100% { transform: translateY(-6px); }
            }
            #carryon-boot-splash.carryon-splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }
            @media (prefers-reduced-motion: reduce) {
                #carryon-boot-splash img[alt="CarryOn"] { animation: none !important; }
            }
        </style>
</head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-white focus:text-black focus:px-4 focus:py-2 focus:rounded">Skip to main content</a>
        <div id="root"></div>
        <!-- CarryOn boot splash — ALWAYS draws the flag-hero scene (flag
             background + floating logo + caption + spinner), in every
             context (mobile Safari, desktop browser, installed iOS/Android
             PWA). We do not rely on iOS's `apple-touch-startup-image`
             because iOS caches those PNGs at install time and refuses to
             refresh them — causing stale splashes to persist through
             deploys. Drawing in HTML means the current code is what
             shows, every launch.

             Sibling of #root so React mounting doesn't clobber it. Inline
             script at the bottom fades it on `carryon:app-ready`. -->
        <div id="carryon-boot-splash" role="status" aria-label="Loading CarryOn"
             style="position:fixed;inset:0;z-index:2147483000;overflow:hidden;background:#0B1221;color:#F4E7C1;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:opacity 0.45s ease-out,visibility 0s linear 0.45s;">
            <div class="carryon-splash-scene" aria-hidden="true">
                <picture>
                    <source type="image/webp" srcset="%PUBLIC_URL%/flag-bg-800.webp 800w, %PUBLIC_URL%/flag-bg-1280.webp 1280w" sizes="100vw" />
                    <img src="%PUBLIC_URL%/flag-bg.jpg" alt="" aria-hidden="true"
                         style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.95;filter:brightness(1.45) contrast(1.1) saturate(1.35);" />
                </picture>
                <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(11,18,33,0.0) 0%, rgba(11,18,33,0.05) 55%, rgba(14,24,41,0.35) 100%);"></div>
                <div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(ellipse 70% 40% at 50% 50%, rgba(212,175,55,0.08) 0%, transparent 70%);"></div>
                <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px calc(28vh + env(safe-area-inset-bottom, 0px)) 24px;">
                    <img src="%PUBLIC_URL%/carryon-logo.png" alt="CarryOn"
                         style="width:min(66vw,368px);height:auto;display:block;filter:drop-shadow(0 18px 40px rgba(0,0,0,0.6)) drop-shadow(0 6px 16px rgba(212,175,55,0.22));animation:carryon-float-in 0.9s cubic-bezier(0.22,1,0.36,1) both, carryon-float 4.5s ease-in-out 0.9s infinite alternate;" />
                </div>
            </div>
            <!-- Caption + spinner near the bottom of the screen so they
                 don't crowd the logo. -->
            <div class="carryon-splash-foot"
                 style="position:absolute;left:0;right:0;bottom:max(14vh, calc(env(safe-area-inset-bottom, 0px) + 80px));display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none;">
                <div style="font-size:12px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(244,231,193,0.85);text-shadow:0 1px 6px rgba(0,0,0,0.6);">
                    Loading your legacy
                </div>
                <div aria-hidden="true"
                     style="width:26px;height:26px;border-radius:50%;border:2px solid rgba(212,175,55,0.18);border-top-color:#d4af37;animation:carryon-spin 0.9s linear infinite;"></div>
            </div>
        </div>
        <script>
            (function () {
                var splash = document.getElementById('carryon-boot-splash');
                if (!splash) return;
                var remove = function () {
                    splash.classList.add('carryon-splash-hide');
                    setTimeout(function () { splash && splash.parentNode && splash.parentNode.removeChild(splash); }, 500);
                };
                window.addEventListener('carryon:app-ready', remove, { once: true });
                // Safety net — if for any reason the app-ready event is never
                // dispatched (route error before mount, SW upgrade mid-boot,
                // etc.), hide after 10s so the user isn't permanently stuck.
                setTimeout(remove, 10000);
            })();
        </script>
