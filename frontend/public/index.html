        <div id="root"></div>
        <!-- CarryOn boot splash — SIBLING of #root so React mounting
             doesn't clobber it. Uses THE SAME artwork as the native iOS
             LaunchScreen.storyboard (splash-2732x2732.png downscaled to
             splash.jpg, 29KB) so the web cold-boot and the native
             cold-boot are pixel-for-pixel identical. Inline script
             below fades it out on `carryon:app-ready`. -->
        <div id="carryon-boot-splash" role="status" aria-label="Loading CarryOn"
             style="position:fixed;inset:0;background:#0F1629;z-index:2147483000;display:flex;align-items:center;justify-content:center;transition:opacity 0.35s ease-out,visibility 0s linear 0.35s;">
            <img src="%PUBLIC_URL%/splash.jpg" alt=""
                 style="max-width:82%;max-height:82%;object-fit:contain;" />
            <div aria-hidden="true"
                 style="position:absolute;bottom:14vh;width:28px;height:28px;border-radius:50%;border:2px solid rgba(212,175,55,0.14);border-top-color:#d4af37;animation:carryon-spin 0.85s linear infinite;"></div>
            <style>
                @keyframes carryon-spin { to { transform: rotate(360deg); } }
                #carryon-boot-splash.carryon-splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }
            </style>
        </div>
        <script>
            (function () {
                var splash = document.getElementById('carryon-boot-splash');
                if (!splash) return;
                var remove = function () {
                    splash.classList.add('carryon-splash-hide');
                    setTimeout(function () { splash && splash.parentNode && splash.parentNode.removeChild(splash); }, 420);
                };
                window.addEventListener('carryon:app-ready', remove, { once: true });
                // Safety net — if for any reason the app-ready event is never
                // dispatched (route error before mount, SW upgrade mid-boot,
                // etc.), hide after 10s so the user isn't permanently stuck
                // staring at the splash. Tightened from 20s → 10s after a
                // user-reported "stuck splash" on iOS SW upgrade.
                setTimeout(remove, 10000);
            })();
        </script>
