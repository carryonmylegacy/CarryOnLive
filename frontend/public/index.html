        <!-- Boot-splash CSS — placed in <head> so it applies during HTML
             parse, BEFORE #carryon-boot-splash paints. The splash ALWAYS
             draws the flag-hero scene (flag bg + floating logo + caption
             + spinner), in both browser AND installed-PWA mode. This
             avoids iOS caching issues with apple-touch-startup-image. -->
        <style>
            @keyframes carryon-spin { to { transform: rotate(360deg); } }
            @keyframes carryon-float-in {
                0%   { transform: translateY(24px) scale(0.94); opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.2)); }
                60%  { opacity: 1; }
                100% { transform: translateY(0) scale(1); opacity: 1; filter: drop-shadow(0 12px 28px rgba(0,0,0,0.55)) drop-shadow(0 4px 12px rgba(212,175,55,0.18)); }
            }
            @keyframes carryon-float {
                0%   { transform: translateY(0); }
                100% { transform: translateY(-6px); }
            }
            #carryon-boot-splash.carryon-splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }
            @media (prefers-reduced-motion: reduce) {
                #carryon-boot-splash img[alt="CarryOn"] { animation: none !important; }
            }
        </style>

        <div id="root"></div>
        <!-- CarryOn boot splash — ALWAYS draws the flag-hero scene (flag
             background + floating logo + caption + spinner), in every
             context (mobile Safari, desktop browser, installed iOS/Android
             PWA). We do not rely on iOS's `apple-touch-startup-image`
             because iOS caches those PNGs at install time and refuses to
             refresh them — causing stale splashes to persist through
             deploys. Drawing in HTML means the current code is what
             shows, every launch.

             Sibling of #root so React mounting doesn't clobber it. Inline
             script at the bottom fades it on `carryon:app-ready`. -->
        <div id="carryon-boot-splash" role="status" aria-label="Loading CarryOn"
             style="position:fixed;inset:0;z-index:2147483000;overflow:hidden;background:#0B1221;color:#F4E7C1;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:opacity 0.45s ease-out,visibility 0s linear 0.45s;">
            <div class="carryon-splash-scene" aria-hidden="true">
                <img src="%PUBLIC_URL%/flag-bg.jpg" alt="" aria-hidden="true"
                     style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.95;filter:brightness(1.45) contrast(1.1) saturate(1.35);" />
                <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(11,18,33,0.0) 0%, rgba(11,18,33,0.05) 55%, rgba(14,24,41,0.35) 100%);"></div>
                <div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(ellipse 70% 40% at 50% 50%, rgba(212,175,55,0.08) 0%, transparent 70%);"></div>
                <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">
                    <img src="%PUBLIC_URL%/carryon-logo.png" alt="CarryOn"
                         style="width:min(82vw,460px);height:auto;display:block;filter:drop-shadow(0 18px 40px rgba(0,0,0,0.6)) drop-shadow(0 6px 16px rgba(212,175,55,0.22));animation:carryon-float-in 0.9s cubic-bezier(0.22,1,0.36,1) both, carryon-float 4.5s ease-in-out 0.9s infinite alternate;" />
                </div>
            </div>
            <!-- Caption + spinner near the bottom of the screen so they
                 don't crowd the logo. -->
            <div class="carryon-splash-foot"
                 style="position:absolute;left:0;right:0;bottom:max(14vh, calc(env(safe-area-inset-bottom, 0px) + 80px));display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none;">
                <div style="font-size:12px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(244,231,193,0.85);text-shadow:0 1px 6px rgba(0,0,0,0.6);">
                    Loading your legacy
                </div>
                <div aria-hidden="true"
                     style="width:26px;height:26px;border-radius:50%;border:2px solid rgba(212,175,55,0.18);border-top-color:#d4af37;animation:carryon-spin 0.9s linear infinite;"></div>
            </div>
        </div>
        <script>
            (function () {
                var splash = document.getElementById('carryon-boot-splash');
                if (!splash) return;
                var remove = function () {
                    splash.classList.add('carryon-splash-hide');
                    setTimeout(function () { splash && splash.parentNode && splash.parentNode.removeChild(splash); }, 500);
                };
                window.addEventListener('carryon:app-ready', remove, { once: true });
                // Safety net — if for any reason the app-ready event is never
                // dispatched (route error before mount, SW upgrade mid-boot,
                // etc.), hide after 10s so the user isn't permanently stuck.
                setTimeout(remove, 10000);
            })();
        </script>
